<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Size Chart</title>
    <style>
        table {
            border-collapse: collapse;
            width: 60%;
        }

        th, td {
            border: 1px solid #000;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

<table>
    <thead>
        <tr>
            <th>Size</th>
            <th>Chest (in.)</th>
            <th>Waist (in.)</th>
            <th>Length (in.)</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>S</td>
            <td>38</td>
            <td>36</td>
            <td>27</td>
        </tr>
        <tr>
            <td>M</td>
            <td>40</td>
            <td>38</td>
            <td>28</td>
        </tr>
        <tr>
            <td>L</td>
            <td>42</td>
            <td>40</td>
            <td>29</td>
        </tr>
        <tr>
            <td>XL</td>
            <td>44</td>
            <td>42</td>
            <td>30</td>
        </tr>
        <tr>
            <td>XXL</td>
            <td>46</td>
            <td>44</td>
            <td>31</td>
        </tr>
    </tbody>
</table>

</body>
</html>
